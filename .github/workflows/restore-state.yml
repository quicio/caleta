name: restore-state

on: workflow_dispatch

concurrency:
  group: restore-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=caleta-tfstate" \
            -backend-config="key=caleta.tfstate" \
            -backend-config="region=auto" \
            -backend-config='endpoints={s3="https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"}' \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true"
        env:
          TF_IN_AUTOMATION: "true"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Import D1
        run: terraform -chdir=infra import cloudflare_d1_database.caleta 9659344f-86a9-430e-bacd-8eb421c46ee7
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_account_subdomain: ${{ secrets.ACCOUNT_SUBDOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_web_url: https://caleta-web.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev

      - name: Import KV
        run: terraform -chdir=infra import cloudflare_workers_kv_namespace.ratelimit e020b35e5e304bdab059113179d04481
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_account_subdomain: ${{ secrets.ACCOUNT_SUBDOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_web_url: https://caleta-web.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev

      - name: Import API worker
        run: terraform -chdir=infra import cloudflare_workers_script.api "${{ secrets.CF_ACCOUNT_ID }}/caleta-api"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_account_subdomain: ${{ secrets.ACCOUNT_SUBDOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_web_url: https://caleta-web.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev

      - name: Import Web worker
        run: terraform -chdir=infra import cloudflare_workers_script.web "${{ secrets.CF_ACCOUNT_ID }}/caleta-web"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_account_subdomain: ${{ secrets.ACCOUNT_SUBDOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_web_url: https://caleta-web.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev