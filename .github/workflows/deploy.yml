name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Build API
        run: npm run build:api

      - name: Build Web
        env:
          VITE_API_URL: https://caleta-api.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev
        run: npm run build:web

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform -chdir=infra init
        env:
          TF_IN_AUTOMATION: "true"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_BACKEND_BUCKET: "caleta-tfstate"
          TF_BACKEND_KEY: "caleta.tfstate"
          TF_BACKEND_REGION: "auto"
          TF_BACKEND_ENDPOINTS_S3: "https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          TF_BACKEND_SKIP_CREDENTIALS_VALIDATION: "true"
          TF_BACKEND_SKIP_REGION_VALIDATION: "true"
          TF_BACKEND_SKIP_REQUESTING_ACCOUNT_ID: "true"

      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_account_subdomain: ${{ secrets.ACCOUNT_SUBDOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_web_url: https://caleta-web.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}