name = "caleta-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# D1 binding
[[d1_databases]]
binding = "DB"
database_name = "caleta"
database_id = "9659344f-86a9-430e-bacd-8eb421c46ee7"

# KV binding (rate limit). El id real se asigna vía Terraform
# (cloudflare_workers_kv_namespace.caleta_ratelimit). Para `wrangler dev`
# local, podés crear el namespace con `wrangler kv:namespace create caleta_ratelimit`
# y pegar el id acá.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e020b35e5e304bdab059113179d04481"

# Vars (configurar via `wrangler secret put` para valores sensibles)
[vars]
STORAGE_PROVIDER = "d1"
# WEB_URL se setea via secret si es dinámica, o aquí como default
WEB_URL = "https://caleta-web.hg-moraga.workers.dev"
