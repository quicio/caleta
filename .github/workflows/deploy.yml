name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Build API
        run: npm run build:api

      - name: Build Web
        env:
          VITE_API_URL: https://caleta-api.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev
        run: npm run build:web

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform -chdir=infra init
        env:
          TF_IN_AUTOMATION: "true"

      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_account_subdomain: ${{ secrets.ACCOUNT_SUBDOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_web_url: https://caleta-web.${{ secrets.ACCOUNT_SUBDOMAIN }}.workers.dev

      - name: Redact secrets in tfstate
        run: |
          python3 - "${{ secrets.GOOGLE_CLIENT_ID }}" "${{ secrets.GOOGLE_CLIENT_SECRET }}" "${{ secrets.JWT_SECRET }}" <<'EOF'
          import sys, json, re
          gid, gsec, jwt = sys.argv[1:4]
          p = "infra/terraform.tfstate"
          data = json.loads(open(p).read())
          def redact(o, key):
              if isinstance(o, dict):
                  if o.get("type") == "secret_text" and isinstance(o.get("text"), str):
                      if o["text"] == gid: o["text"] = "GOOGLE_CLIENT_ID_REDACTED"
                      elif o["text"] == gsec: o["text"] = "GOOGLE_CLIENT_SECRET_REDACTED"
                      elif o["text"] == jwt: o["text"] = "JWT_SECRET_REDACTED"
                  for v in o.values(): redact(v, key)
              elif isinstance(o, list):
                  for v in o: redact(v, key)
          redact(data, "")
          open(p, "w").write(json.dumps(data, indent=2))
          print("tfstate redactado OK")
          EOF

      - name: Commit updated tfstate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/terraform.tfstate
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar tfstate"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main
          fi