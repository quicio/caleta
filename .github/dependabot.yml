version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    target-branch: "main"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # Ignorados porque su bump requiere cambios manuales
    # (wrangler v3→v4 cambia flags; undici es transitiva de wrangler).
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "undici"